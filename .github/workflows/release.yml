name: Build and Release (Windows & Android)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --clean --noconsole --onefile --icon icon.ico --name "SmartVPNWizard" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartVPNWizard-Windows
          path: dist/SmartVPNWizard.exe

  build-android:
    name: Build Android Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Grant execute permission for gradlew
        working-directory: android_app
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: android_app
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Prepare APK binary
        working-directory: android_app
        run: |
          mkdir -p ../release-bin
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../release-bin/SmartVPNWizard.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartVPNWizard-Android
          path: release-bin/SmartVPNWizard.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartVPNWizard-Windows
          path: release-assets/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartVPNWizard-Android
          path: release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.5' }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.5' }}
          files: |
            release-assets/SmartVPNWizard.exe
            release-assets/SmartVPNWizard.apk
          draft: false
          prerelease: false
          generate_release_notes: true
