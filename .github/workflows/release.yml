name: Build and Release (Windows & Android)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyYAML Pillow qrcode pyinstaller

      - name: Build Standalone EXE with PyInstaller
        run: |
          pyinstaller --clean --noconsole --onefile --name "SmartVPNWizard" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartVPNWizard-Windows
          path: dist/SmartVPNWizard.exe

  build-android:
    name: Build Android Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android_app
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: android_app
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK binary
        run: |
          mkdir -p release-bin
          cp android_app/app/build/outputs/apk/release/app-release.apk release-bin/SmartVPNWizard.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartVPNWizard-Android
          path: release-bin/SmartVPNWizard.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartVPNWizard-Windows
          path: release-assets/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: SmartVPNWizard-Android
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SmartVPNWizard.exe
            release-assets/SmartVPNWizard.apk
          draft: false
          prerelease: false
          generate_release_notes: true
